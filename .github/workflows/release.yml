name: release

# Releases the image. Versions follow CUPS (see .github/scripts/compute-version.sh):
#   - push to main: tags v<CUPS_VERSION> for a new CUPS version, or
#     v<CUPS_VERSION>-N when anything else in the image changed; skips
#     docs/examples/CI-only changes.
#   - a tag pushed or a release published by hand: must match CUPS_VERSION
#     in that commit's Dockerfile, or the run fails before building.
# Then it builds and pushes the image to Docker Hub and creates the GitHub
# release with a component-version changelog.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types:
      - published

concurrency:
  # Pushes to main run one at a time; a pending run may be replaced by a
  # newer one, which then releases both changes together.
  group: release-${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_IMAGE: jacobalberty/cups

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.compute.outputs.release }}
      tag: ${{ steps.compute.outputs.tag }}
      previous_tag: ${{ steps.compute.outputs.previous_tag }}
      cups_version: ${{ steps.compute.outputs.cups_version }}
      is_latest: ${{ steps.compute.outputs.is_latest }}
      sha: ${{ steps.compute.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Compute version
        id: compute
        env:
          MANUAL_TAG: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          .github/scripts/compute-version.sh "${MANUAL_TAG}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push image
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Image tags
        id: tags
        env:
          TAG: ${{ needs.version.outputs.tag }}
          CUPS: ${{ needs.version.outputs.cups_version }}
          IS_LATEST: ${{ needs.version.outputs.is_latest }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          tags="${DOCKER_IMAGE}:${TAG},${DOCKER_IMAGE}:sha-${SHA::8}"
          if [ "${IS_LATEST}" = true ]; then
            minor="${CUPS%.*}"
            major="${minor%.*}"
            tags="${tags},${DOCKER_IMAGE}:v${minor},${DOCKER_IMAGE}:v${major},${DOCKER_IMAGE}:latest,${DOCKER_IMAGE}:edge"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "${tags}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
            org.opencontainers.image.created=${{ steps.tags.outputs.created }}
            org.opencontainers.image.revision=${{ needs.version.outputs.sha }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}

      - name: Image digest
        run: echo "${{ steps.docker_build.outputs.digest }}"

  release:
    name: Create GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      PREV: ${{ needs.version.outputs.previous_tag }}
      SHA: ${{ needs.version.outputs.sha }}
      IS_LATEST: ${{ needs.version.outputs.is_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.sha }}

      - name: Build release notes
        run: |
          .github/scripts/release-notes.sh "${TAG}" "${SHA}" "${PREV}" > release-notes.md
          args=(-f "tag_name=${TAG}" -f "target_commitish=${SHA}")
          [ -z "${PREV}" ] || args+=(-f "previous_tag_name=${PREV}")
          gh api "repos/${GH_REPO}/releases/generate-notes" "${args[@]}" --jq .body >> release-notes.md
          cat release-notes.md

      - name: Create or update release
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            # Published by hand: fill in the notes only if they were left empty.
            if [ -z "$(gh release view "${TAG}" --json body --jq .body)" ]; then
              gh release edit "${TAG}" --notes-file release-notes.md
            else
              echo "Release ${TAG} already has notes; leaving them."
            fi
          else
            gh release create "${TAG}" --target "${SHA}" --title "${TAG}" \
              --notes-file release-notes.md "--latest=${IS_LATEST}"
          fi
